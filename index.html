<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RykShortner - Instant Link Shortener</title>
    <script>
        const FIREBASE_URL = "https://link-tracker-28893-default-rtdb.firebaseio.com";
        
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('r');

        // الٹرا فاسٹ ری ڈائریکٹ: جیسے ہی کوئی کوڈ ملے، فورا ڈیٹا بیس سے اٹھا کر بغیر کسی ویٹنگ کے بھیج دو
        if (code) {
            // پہلے براؤزر کی لوکل ہسٹری چیک کریں تاکہ اور بھی زیادہ تیز کھل سکے
            const localMap = JSON.parse(localStorage.getItem('url_map') || '{}');
            if (localMap[code]) {
                fetch(`${FIREBASE_URL}/clicks/${code}.json`).then(r => r.json()).then(c => {
                    fetch(`${FIREBASE_URL}/clicks/${code}.json`, { method: 'PUT', body: JSON.stringify((c || 0) + 1), keepalive: true });
                }).catch(() => {});
                window.location.replace(localMap[code]);
            } else {
                fetch(`${FIREBASE_URL}/links/${code}.json`)
                    .then(res => res.json())
                    .then(targetUrl => {
                        if (targetUrl) {
                            fetch(`${FIREBASE_URL}/clicks/${code}.json`).then(r => r.json()).then(c => {
                                fetch(`${FIREBASE_URL}/clicks/${code}.json`, { method: 'PUT', body: JSON.stringify((c || 0) + 1), keepalive: true });
                            }).catch(() => {});
                            window.location.replace(targetUrl);
                        } else {
                            document.addEventListener('DOMContentLoaded', () => {
                                document.body.innerHTML = "<h2 style='text-align:center; color:#ef4444; margin-top:100px; font-family:sans-serif;'>Link not found!</h2>";
                            });
                        }
                    }).catch(() => {});
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 900px; 
            margin: 30px auto; 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.05);
            display: none;
        }
        h1 { color: #38bdf8; margin-top: 0; font-size: 26px; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .tagline { text-align: center; color: #94a3b8; margin-top: -10px; margin-bottom: 25px; font-size: 14px; }
        .creator-box { 
            background: rgba(51, 65, 85, 0.7); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .creator-box input { 
            flex: 1; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            font-size: 15px; 
            min-width: 220px; 
            outline: none;
        }
        .creator-box button { 
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); 
            color: #0f172a; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { 
            background: rgba(51, 65, 85, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
        }
        .card h3 { margin: 0; font-size: 14px; color: #94a3b8; }
        .card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; color: #4ade80; }
        .chart-container { background: rgba(15, 23, 42, 0.6); padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; word-break: break-all; }
        th { color: #38bdf8; font-size: 14px; }
        td { font-size: 13px; }
        .copy-btn { 
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
            color: #0f172a; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <h1>⚡ RykShortner</h1>
        <p class="tagline">Lightning Fast & Secure Link Shortener</p>
        
        <div class="creator-box">
            <input type="url" id="targetUrlInput" placeholder="Paste your long URL here (e.g. https://example.com)...">
            <button onclick="createNewShortLink()">Shorten Link</button>
        </div>

        <div class="stats-grid" id="statsCards"></div>
        <div class="chart-container">
            <canvas id="clicksChart" height="90"></canvas>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Short Code</th>
                    <th>Original Link (Destination)</th>
                    <th>Short Link</th>
                    <th>Clicks</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="linksTable"></tbody>
        </table>
    </div>

    <script>
        if (!code) {
            document.getElementById('dashboard').style.display = 'block';
            
            const chartScript = document.createElement('script');
            chartScript.src = "https://cdn.jsdelivr.net/npm/chart.js";
            chartScript.onload = loadAnalytics;
            document.head.appendChild(chartScript);
        }

        function getMyCodes() {
            return JSON.parse(localStorage.getItem('my_short_codes') || '[]');
        }

        function saveMyCode(newCode, targetUrl) {
            let myCodes = getMyCodes();
            if (!myCodes.includes(newCode)) {
                myCodes.push(newCode);
                localStorage.setItem('my_short_codes', JSON.stringify(myCodes));
            }
            let localMap = JSON.parse(localStorage.getItem('url_map') || '{}');
            localMap[newCode] = targetUrl;
            localStorage.setItem('url_map', JSON.stringify(localMap));
        }

        async function loadAnalytics() {
            let myCodes = getMyCodes();
            let linksData = {};
            let clickData = {};
            
            try {
                const [linksRes, clicksRes] = await Promise.all([
                    fetch(`${FIREBASE_URL}/links.json`),
                    fetch(`${FIREBASE_URL}/clicks.json`)
                ]);
                const allLinks = (await linksRes.json()) || {};
                clickData = (await clicksRes.json()) || {};

                myCodes.forEach(c => {
                    if (allLinks[c]) {
                        linksData[c] = allLinks[c];
                    }
                });
            } catch (e) {}

            const labels = [];
            const counts = [];
            let totalAllClicks = 0;
            const tableBody = document.getElementById('linksTable');
            tableBody.innerHTML = "";
            const baseUrl = window.location.origin + window.location.pathname;

            if (Object.keys(linksData).length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No links created from this device yet. Paste a URL above!</td></tr>`;
            }

            for (const [key, targetUrl] of Object.entries(linksData)) {
                const count = clickData[key] || 0;
                totalAllClicks += count;
                labels.push(key);
                counts.push(count);

                const fullShortUrl = `${baseUrl}?r=${key}`;
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${key}</strong></td>
                        <td style="color: #94a3b8; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><a href="${targetUrl}" target="_blank" title="${targetUrl}" style="color: #94a3b8; text-decoration: none;">${targetUrl}</a></td>
                        <td><a href="${fullShortUrl}" target="_blank" style="color:#38bdf8;">${fullShortUrl}</a></td>
                        <td style="color: #4ade80; font-weight: bold;">${count}</td>
                        <td><button class="copy-btn" onclick="copyLink('${fullShortUrl}')">Copy</button></td>
                    </tr>
                `;
            }

            document.getElementById('statsCards').innerHTML = `
                <div class="card"><h3>My Links</h3><p>${Object.keys(linksData).length}</p></div>
                <div class="card"><h3>My Total Clicks</h3><p>${totalAllClicks}</p></div>
            `;

            if (window.myChart) window.myChart.destroy();
            window.myChart = new Chart(document.getElementById('clicksChart').getContext('2d'), {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Clicks', data: counts, backgroundColor: '#38bdf8', borderRadius: 6 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 } }, x: { ticks: { color: '#94a3b8' } } } }
            });
        }

        async function createNewShortLink() {
            let longUrl = document.getElementById('targetUrlInput').value.trim();
            if (!longUrl) return alert("Please enter a URL first!");
            if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
                longUrl = 'https://' + longUrl;
            }

            const randomCode = Math.random().toString(36).substring(2, 7);

            try {
                const response = await fetch(`${FIREBASE_URL}/links/${randomCode}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(longUrl)
                });
                if (!response.ok) throw new Error();

                saveMyCode(randomCode, longUrl);
                document.getElementById('targetUrlInput').value = "";
                loadAnalytics();
            } catch (e) {
                alert("Error creating link!");
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            alert("Copied: " + url);
        }
    </script>
</body>
</html>
