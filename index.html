<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Link Shortener & Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-top: 0; font-size: 24px; text-align: center; }
        .creator-box { background: #334155; padding: 20px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; }
        .creator-box input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; min-width: 200px; }
        .creator-box button { background: #4ade80; color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .creator-box button:hover { background: #22c55e; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0; font-size: 14px; color: #94a3b8; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #4ade80; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; word-break: break-all; }
        th { color: #38bdf8; }
        .copy-btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .copy-btn:hover { background: #7dd3fc; }
        #loader { text-align: center; margin-top: 100px; display: none; }
    </style>
    <script>
        const FIREBASE_URL = "https://link-tracker-28893-default-rtdb.firebaseio.com";
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('r');

        if (code) {
            fetch(`${FIREBASE_URL}/links/${code}.json`)
                .then(res => res.json())
                .then(targetUrl => {
                    if (targetUrl) {
                        fetch(`${FIREBASE_URL}/clicks/${code}.json`)
                            .then(res => res.json())
                            .then(currentCount => {
                                const newCount = (currentCount || 0) + 1;
                                fetch(`${FIREBASE_URL}/clicks/${code}.json`, {
                                    method: 'PUT',
                                    body: JSON.stringify(newCount),
                                    keepalive: true
                                });
                            }).catch(() => {});

                        window.location.replace(targetUrl);
                    } else {
                        document.body.innerHTML = "<h2 style='text-align:center; color:#ef4444; margin-top:100px;'>Link not found!</h2>";
                    }
                }).catch(() => {
                    document.body.innerHTML = "<h2 style='text-align:center; color:#ef4444; margin-top:100px;'>Database connection error!</h2>";
                });
        }
    </script>
</head>
<body>

    <div id="loader">
        <h2>Redirecting...</h2>
    </div>

    <div class="container" id="dashboard" style="display: none;">
        <h1>🚀 Global Link Shortener & Tracker</h1>
        
        <div class="creator-box">
            <input type="url" id="targetUrlInput" placeholder="Paste your long URL here (e.g. https://example.com)...">
            <button onclick="createNewShortLink()">Shorten Link</button>
        </div>

        <div class="stats-grid" id="statsCards"></div>
        <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <canvas id="clicksChart" height="100"></canvas>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Short Code</th>
                    <th>Short Link (For Facebook)</th>
                    <th>Clicks</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="linksTable"></tbody>
        </table>
    </div>

    <script>
        if (!code) {
            document.getElementById('dashboard').style.display = 'block';
            loadAnalytics();
        } else {
            document.getElementById('loader').style.display = 'block';
        }

        async function loadAnalytics() {
            let linksData = {};
            let clickData = {};
            
            try {
                const [linksRes, clicksRes] = await Promise.all([
                    fetch(`${FIREBASE_URL}/links.json`),
                    fetch(`${FIREBASE_URL}/clicks.json`)
                ]);
                linksData = (await linksRes.json()) || {};
                clickData = (await clicksRes.json()) || {};
            } catch (e) {
                console.error("Database error");
            }

            const labels = [];
            const counts = [];
            let totalAllClicks = 0;
            const tableBody = document.getElementById('linksTable');
            tableBody.innerHTML = "";
            const baseUrl = window.location.origin + window.location.pathname;

            for (const [key, targetUrl] of Object.entries(linksData)) {
                const count = clickData[key] || 0;
                totalAllClicks += count;
                labels.push(key);
                counts.push(count);

                const fullShortUrl = `${baseUrl}?r=${key}`;
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${key}</strong></td>
                        <td style="font-size: 13px; color: #94a3b8;"><a href="${fullShortUrl}" target="_blank" style="color:#38bdf8;">${fullShortUrl}</a></td>
                        <td style="color: #4ade80; font-weight: bold;">${count}</td>
                        <td><button class="copy-btn" onclick="copyLink('${fullShortUrl}')">Copy</button></td>
                    </tr>
                `;
            }

            document.getElementById('statsCards').innerHTML = `
                <div class="card"><h3>Total Links</h3><p>${Object.keys(linksData).length}</p></div>
                <div class="card"><h3>Total Clicks</h3><p>${totalAllClicks}</p></div>
            `;

            if (window.myChart) {
                window.myChart.destroy();
            }

            window.myChart = new Chart(document.getElementById('clicksChart').getContext('2d'), {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Clicks', data: counts, backgroundColor: '#38bdf8', borderRadius: 6 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { display: false } } }, plugins: { legend: { labels: { color: '#f8fafc' } } } }
            });
        }

        async function createNewShortLink() {
            let longUrl = document.getElementById('targetUrlInput').value.trim();
            if (!longUrl) {
                alert("Please enter a URL first!");
                return;
            }
            if (!longUrl.startsWith('http://') && !longUrl.startsWith('https://')) {
                longUrl = 'https://' + longUrl;
            }

            const randomCode = Math.random().toString(36).substring(2, 7);

            try {
                const response = await fetch(`${FIREBASE_URL}/links/${randomCode}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(longUrl)
                });
                
                if (!response.ok) {
                    throw new Error("Firebase permission denied");
                }

                document.getElementById('targetUrlInput').value = "";
                alert("Success! Link created.");
                loadAnalytics();
            } catch (e) {
                alert("Error: Firebase Realtime Database ke 'Rules' mein ja kar read/write ko true karein!");
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            alert("Copied: " + url);
        }
    </script>
</body>
</html>
